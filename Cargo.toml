[workspace]
members = ["architecturekit-macros"]

[workspace.package]
version = "0.7.0"
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/thenativeweb/architecturekit-rust"
license = "MIT"

[package]
name = "architecturekit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Building blocks for DDD-based applications with CQRS and event sourcing, on top of the EventSourcingDB by the native web."
repository.workspace = true
license.workspace = true
keywords = [
  "cqrs",
  "ddd",
  "event-sourcing",
  "esdb",
  "eventsourcingdb",
]
categories = ["database"]

[package.metadata.docs.rs]
features = ["testcontainers"]

[features]
default = ["derive"]
derive = ["dep:architecturekit-macros"]
testcontainers = ["testing", "eventsourcingdb/testcontainer"]
testing = []

[dependencies]
architecturekit-macros = { path = "architecturekit-macros", version = "=0.7.0", optional = true }
chrono = { version = "0.4.45", default-features = false }
ed25519-dalek = "3.0.0"
eventsourcingdb = "4.0.3"
futures-util = "0.3.31"
log = "0.4.27"
serde = "1.0.229"
serde_json = "1.0.154"
tokio = { version = "1.52.3", features = ["rt", "sync"] }

[dev-dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["serde"] }
eventsourcingdb = { version = "4.0.3", features = ["testcontainer"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.52.3", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
url = "2.5.4"
